---
name: GolangCI Lint
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/**'
      - '**.go'
      - 'vendor/**'
      - '.tools/**'
      - '.golangci.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      # build golangci-lint from the pin in .tools/go.mod so CI and make use the same version, then hand
      # it to the action (install-mode: none) which still provides caching and annotations
      - name: Build golangci-lint from .tools
        run: |
          make .tools/bin/golangci-lint
          mkdir -p "$RUNNER_TEMP/gclbin"
          ln -s "$PWD/.tools/bin/golangci-lint" "$RUNNER_TEMP/gclbin/golangci-lint"
          echo "$RUNNER_TEMP/gclbin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: -v
