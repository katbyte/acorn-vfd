version: 2

project_name: acornvfd

builds:
  # Mirrors katbyte/tctest's target matrix. Deviations, each forced by tinygo.org/x/bluetooth or Go itself:
  #   - freebsd/openbsd/solaris dropped: the BLE library has no backend for them (package fails to compile)
  #   - darwin moved to its own cgo build below: CoreBluetooth is reached through cgo
  # Everything else (linux 386/amd64/arm/arm64/riscv64, windows 386/amd64/arm64) is verified to cross-compile.
  - id: nocgo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - windows
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - '6'
      - '7'
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    ldflags:
      - -s -w
      - -X github.com/katbyte/acornvfd/lib/version.Version={{ .Tag }}
      - -X github.com/katbyte/acornvfd/lib/version.GitCommit={{ .ShortCommit }}

  # darwin needs cgo for CoreBluetooth, so this build only works when goreleaser runs on macOS (release.yaml does)
  - id: darwin
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
      - -mod=vendor
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/katbyte/acornvfd/lib/version.Version={{ .Tag }}
      - -X github.com/katbyte/acornvfd/lib/version.GitCommit={{ .ShortCommit }}

universal_binaries:
  - ids: [darwin]
    replace: false # also ship a single fat darwin binary alongside amd64/arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

signs:
  - cmd: cosign
    artifacts: checksum # signing checksums.txt covers every artifact it lists
    # cosign v3 writes a single sigstore bundle (signature + certificate) instead of separate .sig/.pem files
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '--yes' # keyless signing via the workflow's OIDC token, no prompt in CI
      - '${artifact}'
    output: true

changelog:
  filters:
    exclude:
      - '^Bump '
      - 'merge main'
