version: "2"

run:
  timeout: 10m
  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - asasalint                 # check for pass []any as any in variadic func(...any)
    - asciicheck                # ensure code does not contain non-ASCII identifiers
    - bidichk                   # checks for dangerous unicode character sequences
    - bodyclose                 # checks whether HTTP response bodies are closed
    - canonicalheader           # checks that net/http.Header keys use canonical form
    - containedctx              # detects context.Context contained in a struct
    - contextcheck              # checks whether a function uses a non-inherited context
    - copyloopvar               # detects range loop variables that are overwritten in the loop body
    - dogsled                   # checks assignments with too many blank identifiers
    - decorder                  # check declaration order and count of types, constants, variables and functions
    - durationcheck             # check for common mistakes when working with time.Duration
    - dupword                   # check for duplicated words in comments
    - errcheck                  # checking for unchecked errors
    - errname                   # checks sentinel errors are named ErrFoo and error types FooError
    - errorlint                 # finds code that will cause problems with the error wrapping scheme
    - exhaustive                # checks switch statements over enums for missing cases
    - exptostd                  # detects golang.org/x/exp functions that now exist in the standard library
    - fatcontext                # detects nested contexts accidentally rebuilt in loops and function literals
    - forcetypeassert           # finds unchecked type assertions x.(T) that panic on mismatch
    - gocheckcompilerdirectives # checks //go: compiler directive comments are valid
    - goconst                   # finds repeated strings that could be replaced by a constant
    - gocritic                  # linter for Go source code that specializes in simplifying code
    - govet                     # reports suspicious constructs
    - iface                     # detects incorrect interface usage
    - gosec                     # security linter for Go source code
    - importas                  # enforces consistent import aliases
    - ineffassign               # detects when assignments to existing variables are not used
    - intrange                  # finds for loops that could use Go 1.22+ integer ranges
    - misspell                  # finds commonly misspelled English words
    - mirror                    # reports mismatched bytes/strings function pairs causing needless conversions
    - modernize                 # suggests simplifications using modern Go language and library features
    - nilerr                    # finds code that returns nil after it checks that the error is not nil
    - nilnesserr                # finds code that checks one error but mistakenly returns a different nil error
    - nakedret                  # checks that functions with naked returns are not longer than a maximum size
    - nolintlint                # reports ill-formed or unused //nolint directives
    - nosprintfhostport         # checks for misuse of Sprintf to construct host:port in a URL
    - prealloc                  # finds slice declarations that could potentially be pre-allocated
    - predeclared               # find code that shadows one of Go's predeclared identifiers
    - perfsprint                # checks that fmt.Sprintf can be replaced with a faster alternative
    - paralleltest              # detects missing usage of t.Parallel() method in tests
    - revive                    # configurable meta-linter
    - reassign                  # checks that package variables are not reassigned
    - recvcheck                 # checks methods on a type don't mix pointer and value receivers
    - tagalign                  # checks struct tags align
    - thelper                   # detects test helpers missing a t.Helper() call
    - tparallel                 # detects inappropriate usage of t.Parallel()
    - staticcheck               # checks rules from staticcheck
    - testableexamples          # checks Go examples are testable
    - unused                    # checks Go code for unused constants, variables, functions and types
    - unconvert                 # checks for unnecessary type conversions
    - unparam                   # reports unused function parameters
    - usestdlibvars             # detects string literals replaceable by stdlib constants
    - usetesting                # reports os/context functions with testing replacements
    - wastedassign              # finds wasted assignment statements
    - whitespace                # checks for unnecessary newlines at the start and end of blocks
    - noctx                     # finds sending http request without context.Context
    - makezero                  # finds slice declarations with non-zero initial length

  exclusions:
    rules:
      # flag names repeat across cobra/viper registration, env binding, and validation lists by design
      - path: 'cli/(flags|cmds|clock|lamp)\.go'
        linters:
          - goconst
      # table-driven tests repeat fixture names by design
      - path: '_test\.go'
        linters:
          - goconst
      # the idiomatic `if err := f(); err != nil` scoping shadows err on purpose
      - text: 'shadow: declaration of "err"'
        source: 'if .*err :='
        linters:
          - govet

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # best-effort console output; errors are not actionable
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # ble.Options and bluetooth structs are passed by value on purpose; the cost is irrelevant here
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout for readability over a few bytes
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: unhandled-error
          arguments: [fmt.Print, fmt.Printf, fmt.Println, fmt.Fprint, fmt.Fprintf, fmt.Fprintln, strings.Builder.WriteByte, strings.Builder.WriteString, strings.Builder.WriteRune]
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: unused-receiver
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: deep-exit
          disabled: true
        - name: unchecked-type-assertion
          disabled: true # errcheck covers this with check-type-assertions
        - name: import-shadowing
          disabled: true
        - name: bare-return
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: argument-limit
          disabled: true
        - name: max-control-nesting
          disabled: true
        - name: comment-spacings
          arguments: ["nolint"]
    tagalign:
      align: true
      sort: false
